<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">Deckl installation — after npm publication</title>
  <desc id="desc">Install once with npm install -g deckl, then run deckl install to choose your agent. Alternatively use npx deckl install.</desc>
  <rect width="1280" height="430" fill="#000"/>
  <rect x="1" y="1" width="1278" height="428" rx="12" fill="none" stroke="#333"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="52" y="52" fill="#fff" font-size="14" letter-spacing="3">DECKL / INSTALL</text>
    <text x="1228" y="52" text-anchor="end" fill="#999" font-size="12" letter-spacing="2">AFTER NPM PUBLICATION</text>
    <path d="M52 78H1228" stroke="#333"/>
    <text x="52" y="129" fill="#999" font-size="16">01 / ADD THE COMMAND</text>
    <text x="52" y="185" fill="#fff" font-family="monospace" font-size="38">npm install -g deckl</text>
    <text x="52" y="242" fill="#999" font-size="16">02 / CHOOSE YOUR AGENT</text>
    <text x="52" y="298" fill="#fff" font-family="monospace" font-size="38">deckl install</text>
    <path d="M764 111V311" stroke="#333"/>
    <text x="816" y="145" fill="#fff" font-size="28" letter-spacing="-.6">One command.</text>
    <text x="816" y="181" fill="#fff" font-size="28" letter-spacing="-.6">Your design workflow.</text>
    <text x="816" y="232" fill="#999" font-size="17">Ten skills · Six agent adapters</text>
    <text x="816" y="262" fill="#999" font-size="17">Zero runtime dependencies</text>
    <text x="816" y="292" fill="#999" font-size="17">User or project installation</text>
    <path d="M52 346H1228" stroke="#333"/>
    <text x="52" y="385" fill="#aaa" font-size="14">CLAUDE CODE · CODEX · CURSOR · COPILOT CLI · GEMINI CLI · OPENCODE</text>
    <text x="1228" y="385" text-anchor="end" fill="#fff" font-size="13">OR: npx deckl install</text>
  </g>
</svg>
